version: '3.9'
services:
  backend:
    build:
      context: ./backend
    container_name: architect_planner_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./examples:/app/examples
    environment:
      - DATABASE_URL=sqlite:///./planner.db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: architect_planner_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: architect_planner_db
    environment:
      - POSTGRES_USER=planner
      - POSTGRES_PASSWORD=planner
      - POSTGRES_DB=architect_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
