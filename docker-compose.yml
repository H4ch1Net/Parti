# Development stack with live reload.
#   docker compose up --build
# Web app: http://localhost:5173   API docs: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      PARTI_CORS_ORIGINS: http://localhost:5173
      PARTI_LOG_LEVEL: ${PARTI_LOG_LEVEL:-INFO}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/usr/src/app/src
      - ./frontend/public:/usr/src/app/public
    environment:
      PARTI_API_URL: http://backend:8000
    depends_on:
      - backend
