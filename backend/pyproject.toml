[project]
name = "parti-backend"
version = "2.0.0"
description = "Schematic floor plan generation from plain-language briefs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
