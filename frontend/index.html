<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parti turns a plain-language brief into schematic floor plans you can compare, inspect and export." />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1420" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Parti · Floor plans from a brief</title>
    <script>
      try {
        const t = localStorage.getItem('parti.theme')
        if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
