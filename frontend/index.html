<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parti turns a plain-language brief into schematic floor plans you can compare, inspect and export." />
    <meta name="theme-color" content="#ece8dd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#081c3a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Parti" />
    <meta property="og:description" content="Schematic floor plans from a written brief." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Parti · Schematic floor plans from a brief</title>
    <script>
      try {
        const t = localStorage.getItem('parti.theme')
        if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
